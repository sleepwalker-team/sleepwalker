root: /raid/sleepwalker/hsp
task: breathing
batch_size: 128
epochs: 20
n_samples: 250000
num_workers_dataset: 2
num_workers_dataloader: 8
sample_frequency: 100
target_resolution: "5s"
stride: "1s"
grouped: true
scaler: true
sleep_percentage: 0.5
class_weights:
  apnea: 2.0
  hypopnea: 2.0
  regular breathing: 1.0
channels:
  - abdomen
  - chest
  - airflow
  - spo2
model: utime-big
total_input: "60s"
val_frac: 0.1
test_frac: 0.1
dry: false
use_mlflow: true
max_edf_files: null
patient_limit: null
annotated_only: true
balance_batches: false
balance_gamma: 0.75
