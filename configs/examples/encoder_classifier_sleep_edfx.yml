seed: 17

data:
  name: sleepwalker.datasets.SleepEDFx.SleepEDFx
  channels:
    - logical_name: eeg
      physical_names: [EEG Fpz-Cz]
      preprocessors:
        - name: sleepwalker.datasets.normalizer.ConvertUnit.ConvertUnit
          target: "uV"
        - name: sleepwalker.datasets.normalizer.EEGFilterNormalizer.EEGFilterNormalizer
          fs: 100
  sample_frequency: 100
  annotation_labels: [wake, n1, n2, n3, rem]
  prepare_events:
    name: sleepwalker.training.callbacks.map_events
    mapping:
      wake: wake
      n1: n1
      n2: n2
      n3: n3
      rem: rem
    remove_unmapped: true
  total_input: 30s
  stride: 30s
  output_classes: &classes [wake, n1, n2, n3, rem]
  prepare_patient:
    name: sleepwalker.training.callbacks.prepare_patient_events
    keep_events: [n1, n2, n3, rem]
  prepare_target:
    name: sleepwalker.trainer.utils.targets.prepare_multiclass_target
    target_resolution: 30s
    target_classes: *classes
  patient_filter:
    name: sleepwalker.training.files.filter_edf_files
  files:
    train:
      name: sleepwalker.datasets.utils.get_edf_files_in_repo
      root: data/sleep-edfx/SC
    validation_fraction: 0.1
    test_fraction: 0.2
  label: sleep-edfx
  num_workers: 2

model:
  name: sleepwalker.models.EncoderClassifier.EncoderClassifier
  head: linear  # or mlp
  encoders:  # their features are concatenated; Rocket and MultiRocket work the same way
    - name: sleepwalker.models.MiniRocket.MiniRocket
    - name: sleepwalker.models.YasaFeatures.YasaFeatures  # needs pip install -e ".[yasa]"
      eeg: [eeg]

trainer:
  name: sleepwalker.trainer.MulticlassTrainer.MulticlassTrainer
  target_resolution: 30s
  epochs: 5
  optimizer:
    name: torch.optim.Adam
    lr: 0.001
  loss_function: torch.nn.functional.cross_entropy
  device: cpu
  early_stopping: 3

run:
  experiment_name: sleep-edfx-encoder-classifier-multiclass
  model_name: encoder_classifier
  batch_size: 32
  n_samples: 4096
  n_samples_test: 1024
  num_workers_dataloader: 2
  test_repeats: [1]
  use_mlflow: false
  log_path: results/tutorial
  expert_task: sleep
