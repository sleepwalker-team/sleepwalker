# Example: train a linear or MLP sleep-staging head on frozen MiniRocket features, Sleep-EDF.
# Sleep Cassette (SC) is split into train/validation/test; Sleep Telemetry (ST) is a second test set.
# First build the package from this same config, so channels, units and training split match:
#   sleepwalker package-features configs/examples/rocket_head_sleep_edfx.yml -f minirocket --n-jobs 16 -o /raid/packages/minirocket-sleep-edfx
# Then run:  sleepwalker train configs/examples/rocket_head_sleep_edfx.yml   (or `sleepwalker dry ...` first)
# MultiRocket: package with `-f multirocket` and point `model.package` at it. Its features are not scaled yet
# (values up to ~3000 next to [0, 1]), so a head on it trains poorly; see docs/how-to/features.md.
# EMG is left out: SC stores it as a 1 Hz envelope, ST as raw 100 Hz EMG.

seed: 17

data:
  - name: sleepwalker.datasets.SleepEDFx.SleepEDFx
    # One physical name per channel, so every recording feeds the same signal into the package.
    channels: &channels
      - {logical_name: eeg_frontal, physical_names: [EEG Fpz-Cz], unit: uV}
      - {logical_name: eeg_occipital, physical_names: [EEG Pz-Oz], unit: uV}
      - {logical_name: eog_left, physical_names: [EOG horizontal], unit: uV}
    sample_frequency: 100
    event_mapping: &event_mapping
      sleep stage w: wake
      sleep stage 1: n1
      sleep stage 2: n2
      sleep stage 3: n3
      sleep stage 4: n3
      sleep stage r: rem
    total_input: 30s
    stride: 30s
    assume_units_if_missing: false
    output_classes: &classes [wake, n1, n2, n3, rem]
    prepare_patient: &prepare_patient
      name: sleepwalker.training.callbacks.trim_patient_to_events
      keep_events: [n1, n2, n3, rem]
    prepare_target: &prepare_target
      name: sleepwalker.trainer.utils.targets.prepare_multiclass_target
      target_resolution: 30s
      target_classes: *classes
    # Also drops the hypnogram EDFs, which lack the signal channels.
    patient_filter: &patient_filter
      name: sleepwalker.training.files.filter_edf_files
    files:
      train:
        name: sleepwalker.datasets.utils.get_edf_files_in_repo
        root: /raid/sleepwalker/sleep-edfx/SC
      # ~70/15/15: test_fraction is taken from what remains after the validation split.
      validation_fraction: 0.15
      test_fraction: 0.18
    label: SleepEDF-SC
    num_workers: 32

  - name: sleepwalker.datasets.SleepEDFx.SleepEDFx
    channels: *channels
    sample_frequency: 100
    event_mapping: *event_mapping
    total_input: 30s
    stride: 30s
    assume_units_if_missing: false
    output_classes: *classes
    prepare_patient: *prepare_patient
    prepare_target: *prepare_target
    patient_filter: *patient_filter
    files:
      test:
        name: sleepwalker.datasets.utils.get_edf_files_in_repo
        root: /raid/sleepwalker/sleep-edfx/ST
    label: SleepEDF-ST
    num_workers: 32

model:
  name: sleepwalker.models.PackagedClassifierModel.PackagedClassifierModel
  package: /raid/packages/minirocket-sleep-edfx
  head: mlp
  hidden_dim: 256
  freeze_encoder: true

trainer:
  name: sleepwalker.trainer.MulticlassTrainer.MulticlassTrainer
  target_resolution: 30s
  epochs: 40
  eval_every: 1
  early_stopping: 10
  optimizer:
    name: torch.optim.AdamW
    lr: 1.0e-3
    weight_decay: 1.0e-4
  loss_function: torch.nn.functional.cross_entropy
  # Featurization runs on the CPU anyway; set cuda:0 on a GPU host to train the head there.
  device: cpu

run:
  experiment_name: rocket_head_sleep_edfx
  batch_size: 32
  n_samples: null
  num_workers_dataloader: 4
  use_mlflow: true
  log_path: results/rocket_head
  expert_task: sleep
  tags:
    task: sleep
    model: rocket_head
