label: SHHS
split:
  file: results/iclr2026/other/manifests/shhs.yml
  fold: holdout
  partition: test
num_workers: 32
strict: false
dataset:
  name: sleepwalker.datasets.SHHS.SHHS
  annotator: nsrr
  event_mapping:
    wake|0: wake
    stage 1 sleep|1: n1
    stage 2 sleep|2: n2
    stage 3 sleep|3: n3
    stage 4 sleep|4: n3
    rem sleep|5: rem
  remove_unmapped_events: true
