# Generated from iclr2026/configs/experts/test/sleep_osf.yml by replace_yaml_block.py.
seed: 17
data:
  label: SHHS
  split:
    file: results/iclr2026/other/manifests/shhs.yml
    fold: holdout
    partition: test
  num_workers: 32
  strict: false
  dataset:
    name: sleepwalker.datasets.SHHS.SHHS
    channels:
    # SHHS has one EMG and no leg EMGs; reuse it for the fixed 12-channel model contract.
    - {logical_name: ECG, physical_names: [ECG]}
    - {logical_name: EMG_Chin, physical_names: [EMG]}
    - {logical_name: EMG_LLeg, physical_names: [EMG]}
    - {logical_name: EMG_RLeg, physical_names: [EMG]}
    - {logical_name: ABD, physical_names: [ABDO RES]}
    - {logical_name: THX, physical_names: [THOR RES]}
    - {logical_name: NP, physical_names: [NEW AIR, AIRFLOW, THOR RES]}
    # Some recordings omit SOUND, so use the available respiratory flow signal as its fallback.
    - {logical_name: SN, physical_names: [SOUND, NEW AIR, AIRFLOW]}
    - {logical_name: EOG_E1_A2, physical_names: [EOG(L)]}
    - {logical_name: EOG_E2_A1, physical_names: [EOG(R)]}
    - {logical_name: EEG_C3_A2, physical_names: [EEG(sec), EEG2]}
    - {logical_name: EEG_C4_A1, physical_names: [EEG]}
    group_sampling_strategy: first
    annotator: nsrr
    event_mapping:
      wake|0: wake
      stage 1 sleep|1: n1
      stage 2 sleep|2: n2
      stage 3 sleep|3: n3
      stage 4 sleep|4: n3
      rem sleep|5: rem
    remove_unmapped_events: true
analyses:
- name: resolved
  pipeline:
  - name: sleepwalker.prediction_transforms.resolve_overlaps
    method: mean_probability
test:
  batch_size: 64
  num_workers_dataloader: 8
  n_repeat: 1
  overwrite: false
  output: results/iclr2026/other/shhs/sleep_osf.jsonl
  package: iclr2026/models/osf-sleep
