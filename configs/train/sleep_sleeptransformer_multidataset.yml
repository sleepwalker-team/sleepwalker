seed: 17
data:
  - name: sleepwalker.datasets.SleepEDFx.SleepEDFx
    channels:
      - logical_name: eeg
        physical_names: [EEG Fpz-Cz, EEG Pz-Oz]
        normalizer: &eeg_normalizer
          name: sleepwalker.datasets.normalizer.EEGFilterNormalizer.EEGFilterNormalizer
          fs: 100
        unit: uV
    sample_frequency: 100
    event_mapping:
      sleep stage w: wake
      sleep stage 1: n1
      sleep stage 2: n2
      sleep stage 3: n3
      sleep stage 4: n3
      sleep stage r: rem
    total_input: 630s
    stride: 30s
    rereference:
      - [EEG Fpz-Cz, EEG Pz-Oz]
    assume_units_if_missing: false
    output_classes: [wake, n1, n2, n3, rem]
    prepare_patient:
      name: sleepwalker.training.callbacks.trim_patient_to_events
      keep_events: [n1, n2, n3, rem]
    prepare_target:
      name: sleepwalker.trainer.utils.targets.prepare_multiclass_target
      target_resolution: 30s
      target_classes: [wake, n1, n2, n3, rem]
    patient_filter:
      name: sleepwalker.training.files.filter_edf_files
    files:
      train:
        name: sleepwalker.datasets.utils.get_edf_files_in_repo
        root: /raid/sleepwalker/sleep-edfx
      validation_fraction: 0.1
      test_fraction: 0.3
    label: sleepedfx
    num_workers: 8
  - name: sleepwalker.datasets.HSP.HSP
    channels:
      - logical_name: eeg
        physical_names: [C3-M2, C4-M1, F3-M2, F4-M1, O1-M2, O2-M1, CZ-M2, CZ-M1, C3-M1, C4-M2, F3-M1, F4-M2, O1-M1, O2-M2]
        normalizer: *eeg_normalizer
        unit: uV
    sample_frequency: 100
    event_mapping:
      wake: wake
      n1: n1
      n2: n2
      n3: n3
      rem: rem
    total_input: 630s
    stride: 30s
    assume_units_if_missing: false
    output_classes: [wake, n1, n2, n3, rem]
    prepare_patient:
      name: sleepwalker.training.callbacks.trim_patient_to_events
      keep_events: [n1, n2, n3, rem]
    prepare_target:
      name: sleepwalker.trainer.utils.targets.prepare_multiclass_target
      target_resolution: 30s
      target_classes: [wake, n1, n2, n3, rem]
    patient_filter:
      name: sleepwalker.training.files.filter_edf_files
    files:
      train:
        name: sleepwalker.datasets.HSP.get_annotated_hsp_edf_files
        root: /raid/sleepwalker/hsp
      validation_fraction: 0.1
      test_fraction: 0.3
    label: hsp
    num_workers: 8
model:
  name: sleepwalker.models.SleepTransformer.SleepTransformer
trainer:
  target_offset: 0 days 00:05:00
  target_resolution: 30s
  name: sleepwalker.trainer.MulticlassTrainer.MulticlassTrainer
  epochs: 100
  optimizer:
    name: torch.optim.Adam
    lr: 0.001
    weight_decay: 0.0001
  lr_scheduler:
    name: torch.optim.lr_scheduler.LinearLR
    start_factor: 1
    end_factor: 0.01
    total_iters: 50
  loss_function: torch.nn.functional.cross_entropy
  save_every: 1
  early_stopping: 15
run:
  experiment_name: sleep_sleeptransformer_multidataset
  model_name: sleeptransformer
  collate_fn:
    name: sleepwalker.datasets.Basedataset.batch_collate
    ignore_list: [time, patient, dataset]
  batch_size: 128
  n_samples: 250000
  num_workers_dataloader: 8
  test_repeats: [1, 2, 3, 4, 5, 10]
  use_mlflow: true
  log_path: results/sleep
  tags:
    task: sleep
    model: sleeptransformer
    datasets: sleepedfx+hsp
  expert_task: sleep
