seed: 17
data:
  - name: sleepwalker.datasets.SleepEDFx.SleepEDFx
    channels:
      - logical_name: EEG Fpz-Cz
        physical_names: [EEG Fpz-Cz]
        normalizer:
          name: sleepwalker.datasets.normalizer.EEGFilterNormalizer.EEGFilterNormalizer
          fs: 100
        unit: uV
    sample_frequency: 100
    event_mapping:
      sleep stage w: wake
      sleep stage 1: n1
      sleep stage 2: n2
      sleep stage 3: n3
      sleep stage 4: n3
      sleep stage r: rem
    total_input: 500s
    target_resolution: 30s
    stride: 30s
    assume_units_if_missing: false
    output_classes: [wake, n1, n2, n3, rem]
    prepare_patient:
      name: sleepwalker.training.callbacks.trim_patient_to_events
      keep_events: [n1, n2, n3, rem]
    prepare_target:
      name: sleepwalker.trainer.utils.targets.prepare_multiclass_target
      target_classes: [wake, n1, n2, n3, rem]
    split_overrides:
      test:
        total_input: 450s
      inference:
        total_input: 450s
    files:
      train:
        name: sleepwalker.training.files.select_sleep_staging_files
        root: /raid/sleepwalker/sleep-edfx
        training: true
        sleep_labels: [n1, n2, n3, rem]
        sleep_time_filter_quantile: 0.05
        num_workers: 8
      validation_fraction: 0.1
      test_fraction: 0.3
    label: sleepedfx
    num_workers: 8
model:
  name: sleepwalker.models.TinySleepNet.TinySleepNet
  ts_len: 45000
  seq_len: 15
  use_lstm: true
trainer:
  name: sleepwalker.trainer.MulticlassTrainer.MulticlassTrainer
  epochs: 100
  optimizer:
    name: torch.optim.Adam
    lr: 0.0001
    weight_decay: 0.001
  lr_scheduler:
    name: torch.optim.lr_scheduler.LinearLR
    start_factor: 1
    end_factor: 0.01
    total_iters: 50
  loss_function: torch.nn.functional.cross_entropy
  save_every: 1
  early_stopping: 15
  class_weights:
    wake: 1
    n1: 1.5
    n2: 1
    n3: 1
    rem: 1
  train_transform:
    - name: sleepwalker.datasets.augmentation.TimeShiftAndCrop.TimeShiftAndCrop
      max_shift: 60s
      fill: closest
      sampling_frequency: 100
      output_size: 450s
run:
  experiment_name: sleep_tinysleepnet
  model_name: tinysleepnet
  batch_size: 128
  n_samples: 250000
  num_workers_dataloader: 8
  test_repeats: [1]
  use_mlflow: true
  log_path: results/sleep
  tags:
    task: sleep
    model: tinysleepnet
  expert_task: sleep
